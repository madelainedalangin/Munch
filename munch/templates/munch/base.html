<!DOCTYPE html>
<html lang="en">
<head>
    <title>Munch | {% block title %}{% endblock title %}</title>
</head>
<body>
    {% block body %}
    <header>
        {% block header %}
        {% endblock header %}
        <nav>
            {% block nav %}
            {% endblock nav %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock content %}
    </main>
    {% endblock body %}
</body>
</html>
