<!-- The following HTML from Google, Gemini, "Django Author Identity", 02-28-2026 -->
<h2>Create a Munch Account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>
<p>Already have an account? <a href="{% url 'munch:login' %}">Login here</a></p>
