<a href="{{ author.web }}">
    <div class="user-block">
        <div class="user-block__avatar">
            <img src="{{ author.profileImage|default:'https://via.placeholder.com/150' }}">
        </div>
        <div class="user-block__details">
           <p class="user-block__display-name">{{ author.displayName }}</p>
           <p class="user-block__username">@{{ author.username }}</p>
        </div>
    </div>
</a>
