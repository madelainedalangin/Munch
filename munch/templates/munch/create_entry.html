{% extends "munch/nav-content.html" %}
{% load static %}

{% block links %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'munch/css/create_entry.css' %}">
{% endblock links %}

{% block content-scrollable %}
<h2>{{ title }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{{ button_title }}</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const typeSelect = document.querySelector('select[name="contentType"]');
    const contentArea = document.querySelector('textarea[name="content"]');
    const fileInput = document.querySelector('input[type="file"]');
    
    const contentRow = contentArea.closest('p') || contentArea.parentElement;
    const fileRow = fileInput.closest('p') || fileInput.parentElement;

    // The following function from Google, Gemini, "Toggle required attribute", March 30, 2026
    function toggleRequired() {
        const isImage = typeSelect.value.includes('image/');

        if (isImage) {
            // Hide text box, show file upload
            contentRow.style.display = 'none';
            contentArea.removeAttribute('required');
            
            fileRow.style.display = 'block';
            fileInput.setAttribute('required', 'required');
        } else {
            // Show text box, hide file upload
            contentRow.style.display = 'block';
            contentArea.setAttribute('required', 'required');
            
            fileRow.style.display = 'none';
            fileInput.removeAttribute('required');
            
            // Clear file selection if switched back to text mode
            fileInput.value = ""; 
            const label = fileRow.querySelector('.file-input-label');
            if (label) label.textContent = 'No file selected';
        }
    }

    typeSelect.addEventListener('change', toggleRequired);
    toggleRequired();
    if (!fileInput) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'file-input-wrapper';

    const label = document.createElement('span');
    label.className = 'file-input-label';
    label.textContent = 'No file selected';

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'file-input-btn';
    button.textContent = 'Browse';
    button.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
        label.textContent = fileInput.files[0] ? fileInput.files[0].name : 'No file selected';
    });

    fileInput.style.display = 'none';
    fileInput.parentNode.insertBefore(wrapper, fileInput);
    wrapper.appendChild(fileInput);
    wrapper.appendChild(label);
    wrapper.appendChild(button);
});
</script>
{% endblock content-scrollable %}
